name: Compile LaTeX to PDF

on:
  push:
    branches: [ main ]
    paths:
      - 'proposal.tex'
      - 'refs.bib'
      - 'APS360.sty'
      - '.github/workflows/latex-compile.yml'
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended texlive-bibtex-extra

      - name: Compile LaTeX
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error proposal.tex

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: proposal-pdf
          path: proposal.pdf
